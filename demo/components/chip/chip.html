<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <title>UI chip</title>
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, minimum-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap" rel="stylesheet">
  <link href="../../../src/styles/m3/tokens.css" rel="stylesheet" type="text/css" />
  <link href="../../../src/styles/m3/theme.css" rel="stylesheet" type="text/css" />
  <style>
    .demo-row {
      margin: 20px 0;
    }

    .demo .demo-section {
      max-width: 858px;
      margin: 0 auto 80px auto;
    }

    .demo h2, .demo h3 {
      margin-bottom: 36px;
    }

    .frame {
      padding: 40px;
      border-radius: 20px;
      border: 1px var(--md-sys-color-outline) solid;
    }

    .grid-5 {
      display: grid;
      grid-template-columns: 160px 1fr 1fr 1fr 1fr;
      gap: 0 0;
      justify-items: center; 
      align-items: center;
      grid-template-rows: 40px repeat(auto-fit, minmax(80px, 1fr));
      grid-auto-rows: 80px;

      padding: 40px;
      border-radius: 20px;
      border: 1px var(--md-sys-color-outline) solid;
    }

    .grid-4 {
      display: grid;
      grid-template-columns: 160px 1fr 1fr 1fr;
      gap: 0 0;
      justify-items: center; 
      align-items: center;
      grid-template-rows: 40px repeat(auto-fit, minmax(80px, 1fr));
      grid-auto-rows: 60px;

      padding: 40px;
      border-radius: 20px;
      border: 1px var(--md-sys-color-outline) solid;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      justify-items: center;
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <script type="module" src="./chip.ts"></script>
</body>
</html>
