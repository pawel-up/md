<!DOCTYPE html>
<html lang="en" class="theme-light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MD3 Theme</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=arrow_drop_down,check" rel="stylesheet" />
    <link href="../../../src/styles/m3/tokens.css" rel="stylesheet" type="text/css" />
    <link href="../../../src/styles/m3/theme.css" rel="stylesheet" type="text/css" />
    <style>
      :root {
        --dot-size: 1px;
        --dot-space: 7px;
      }

      html,
      body {
        margin: 0;
        font-family: 'Roboto', 'Noto', sans-serif;
        background-color: var(--md-sys-color-surface);
        color: var(--md-sys-color-on-surface);
        background-image: radial-gradient(var(--md-sys-color-inverse-on-surface) 1px, transparent 0);
        background-size: var(--dot-space) var(--dot-space);
      }

      .demo {
        margin: 0;
        padding: 0;
        min-height: 100vh;
      }

      header {
        background-color: var(--md-sys-color-surface-variant);
        color: var(--md-sys-color-on-surface-variant);
        display: flex;
        align-items: center;

        max-width: 1440px;
        margin: 20px 40px;
        padding: 0 24px;
        border-radius: 40px;

        font-family: var(--md-sys-typescale-title-large-font);
        font-weight: var(--md-sys-typescale-title-large-weight);
        font-size: var(--md-sys-typescale-title-large-size);
        letter-spacing: var(--md-sys-typescale-title-large-tracking);
        line-height: var(--md-sys-typescale-title-large-height);
      }

      main {
        /* max-width: 900px;
      margin: 40px auto; */
        border-radius: 40px;
        padding: 24px;

        /* background-color: var(--md-sys-color-primary-container);
      color: var(--md-sys-color-on-primary-container); */
      }

      .demo-section {
        margin: 60px 0;
      }
    </style>
    <style>
      .color-grid {
        --min-tile-size: 110px;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(var(--min-tile-size), 1fr));
        gap: 1rem;
        margin-block: 1.5rem;
      }
      .color-item {
        font: 12px/1.2 Roboto, system-ui, sans-serif;
        text-align: center;
        border: 1px solid var(--md-sys-color-outline-variant, #ccc);
        border-radius: 8px;
        overflow: hidden;
        background: var(--md-sys-color-surface, #fff);
        box-shadow: 0 1px 2px rgba(0,0,0,.08);
        display: flex;
        flex-direction: column;

        code {
          flex: 1;
        }
      }
      .color-item .swatch {
        aspect-ratio: 3/2;
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--md-sys-color-on-surface, #000);
        font-size: 10px;
        position: relative;
      }
      .color-item .swatch span.value {
        position: absolute;
        inset: auto 4px 4px 4px;
        padding: 2px 4px;
        font-size: 10px;
        border-radius: 4px;
        background: rgba(0,0,0,.45);
        color: #fff;
        mix-blend-mode: luminosity;
        backdrop-filter: blur(2px);
      }
      .color-item code {
        display: block;
        padding: .5rem .25rem .65rem;
        word-break: break-word;
        color: var(--md-sys-color-on-surface-variant, #444);
        background: linear-gradient(var(--md-sys-color-surface-container-highest, #f7f7f7), var(--md-sys-color-surface-container-high, #eee));
      }
      .controls { display: flex; gap: .75rem; align-items: center; margin-top: .5rem; }
      .controls button {
        font: 500 12px/1 Roboto, system-ui, sans-serif;
        padding: .5rem .75rem;
        border-radius: 20px;
        cursor: pointer;
        background: var(--md-sys-color-primary);
        color: var(--md-sys-color-on-primary);
        border: none;
      }
      .controls button[aria-pressed="true"] {
        background: var(--md-sys-color-primary-container);
        color: var(--md-sys-color-on-primary-container);
      }
    </style>
  </head>
  <body class="demo">
    <div id="app">
      <header><h1 class="api-title">MD3 Theme</h1></header>
      <main>
        <a href="../">Back</a>
        <p>This is a demonstration of the Material Design 3 theme.</p>

        <section class="demo-section">
          <h2 class="display-large">System Colors</h2>
          <div class="controls" id="themeToggle">
            <span style="font-size:12px;opacity:.75">Theme:</span>
            <button type="button" data-theme="light" aria-pressed="true">Light</button>
            <button type="button" data-theme="dark" aria-pressed="false">Dark</button>
          </div>
          <div class="color-grid" id="colorGrid" aria-live="polite"></div>
        </section>
      </main>
    </div>
    <script>
      // Target variables (selected portion from theme.css lines 7-55)
      const COLOR_VARS = [
        '--md-sys-color-primary',
        '--md-sys-color-surface-tint',
        '--md-sys-color-on-primary',
        '--md-sys-color-primary-container',
        '--md-sys-color-on-primary-container',
        '--md-sys-color-secondary',
        '--md-sys-color-on-secondary',
        '--md-sys-color-secondary-container',
        '--md-sys-color-on-secondary-container',
        '--md-sys-color-tertiary',
        '--md-sys-color-on-tertiary',
        '--md-sys-color-tertiary-container',
        '--md-sys-color-on-tertiary-container',
        '--md-sys-color-error',
        '--md-sys-color-on-error',
        '--md-sys-color-error-container',
        '--md-sys-color-on-error-container',
        '--md-sys-color-background',
        '--md-sys-color-on-background',
        '--md-sys-color-surface',
        '--md-sys-color-on-surface',
        '--md-sys-color-surface-variant',
        '--md-sys-color-on-surface-variant',
        '--md-sys-color-outline',
        '--md-sys-color-outline-variant',
        '--md-sys-color-shadow',
        '--md-sys-color-scrim',
        '--md-sys-color-inverse-surface',
        '--md-sys-color-inverse-on-surface',
        '--md-sys-color-inverse-primary',
        '--md-sys-color-primary-fixed',
        '--md-sys-color-on-primary-fixed',
        '--md-sys-color-primary-fixed-dim',
        '--md-sys-color-on-primary-fixed-variant',
        '--md-sys-color-secondary-fixed',
        '--md-sys-color-on-secondary-fixed',
        '--md-sys-color-secondary-fixed-dim',
        '--md-sys-color-on-secondary-fixed-variant',
        '--md-sys-color-tertiary-fixed',
        '--md-sys-color-on-tertiary-fixed',
        '--md-sys-color-tertiary-fixed-dim',
        '--md-sys-color-on-tertiary-fixed-variant',
        '--md-sys-color-surface-dim',
        '--md-sys-color-surface-bright',
        '--md-sys-color-surface-container-lowest',
        '--md-sys-color-surface-container-low',
        '--md-sys-color-surface-container',
        '--md-sys-color-surface-container-high',
        '--md-sys-color-surface-container-highest'
      ];

      function cssVarValue(name) {
        return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
      }

      function renderGrid() {
        const grid = document.getElementById('colorGrid');
        grid.innerHTML = '';
        const frag = document.createDocumentFragment();
        COLOR_VARS.forEach(v => {
          const value = cssVarValue(v);
          const item = document.createElement('div');
          item.className = 'color-item';
          const swatch = document.createElement('div');
          swatch.className = 'swatch';
          swatch.style.background = `var(${v})`;
          // Add a small overlay showing resolved value if it looks like a color
          const isColor = /#|rgb|hsl|oklab|lab|lch/i.test(value);
          if (isColor && value) {
            const valSpan = document.createElement('span');
            valSpan.className = 'value';
            valSpan.textContent = value;
            swatch.appendChild(valSpan);
          }
          const label = document.createElement('code');
          label.textContent = v;
          item.appendChild(swatch);
            item.appendChild(label);
          frag.appendChild(item);
        });
        grid.appendChild(frag);
      }

      // Theme toggle (light/dark)
      const toggleRoot = document.getElementById('themeToggle');
      toggleRoot.addEventListener('click', e => {
        const btn = e.target.closest('button[data-theme]');
        if (!btn) return;
        const theme = btn.dataset.theme;
        document.documentElement.classList.remove('theme-light','theme-dark');
        document.documentElement.classList.add(`theme-${theme}`);
        toggleRoot.querySelectorAll('button[data-theme]').forEach(b => {
          b.setAttribute('aria-pressed', b === btn ? 'true' : 'false');
        });
        renderGrid();
      });

      // Initial render after styles ready
      window.addEventListener('DOMContentLoaded', renderGrid);
    </script>
  </body>
</html>
