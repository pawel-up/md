<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <title>Date Picker Demo</title>
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, minimum-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=calendar_month,arrow_drop_down,check" rel="stylesheet" />
  <link href="../../../src/styles/m3/tokens.css" rel="stylesheet" type="text/css" />
  <link href="../../../src/styles/m3/theme.css" rel="stylesheet" type="text/css" />
  <link href="../../../src/styles/m3/native.css" rel="stylesheet" type="text/css" />
  <style>
    .demo-row {
      margin: 20px 0;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .demo .demo-section {
      max-width: 858px;
      margin: 0 auto 80px auto;
      --_row-height: 80px;
    }

    .demo .demo-section.l {
      max-width: 1080px;
      --_row-height: 120px;
    }

    .demo .demo-section.xl {
      max-width: 1380px;
      --_row-height: 180px;
    }

    .demo h2, .demo h3 {
      margin-bottom: 36px;
    }

    ol {
      padding-left: 0;
      list-style: none;
      counter-reset: item;
    }

    ol > li {
      margin-top: 4px;
      margin-bottom: 20px;
      margin-left: 36px;
      counter-increment: item;
      vertical-align: baseline;
    }

    ol > li:before {
      display: inline-block;
      width: 24px;
      height: 32px;
      margin-top: -4px;
      margin-right: 10px;
      margin-left: -36px;
      border-radius: 12px;
      background: var(--md-sys-color-inverse-surface);
      color: var(--md-sys-color-inverse-on-surface);
      line-height: 32px;
      text-align: center;
    }

    ol.decimal > li:before {
      content: counter(item, decimal);
    }

    .variant-grid {
      display: grid;
      gap: 24px;
      grid-template-columns: 80px 1fr 1fr 1fr; 
      grid-template-rows: auto auto; 
      justify-items: start; 
      align-items: center; 
      padding: 40px;
      border-radius: 20px;
      border: 1px var(--md-sys-color-outline) solid;
    }

    .modal-demo-grid {
      display: grid;
      gap: 24px;
      grid-template-columns: 1fr 1fr;
      padding: 40px;
      border-radius: 20px;
      border: 1px var(--md-sys-color-outline) solid;
    }

    .modal-demo-item {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .config-grid {
      display: flex;
      gap: 24px;
      flex-wrap: wrap;
    }

    .config-item {
      display: flex;
      align-items: center;
    }

    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }

    .form-row {
      margin-bottom: 16px;
    }

    .form-actions {
      display: flex;
      gap: 12px;
      margin-top: 24px;
    }

    .demo-output {
      padding: 12px;
      background: var(--md-sys-color-surface-container);
      border-radius: 8px;
      font-family: monospace;
      font-size: 12px;
      color: var(--md-sys-color-on-surface);
      white-space: pre-wrap;
      min-height: 40px;
    }

    .legend-marker {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background-color: var(--md-sys-color-inverse-surface);
      color: var(--md-sys-color-inverse-on-surface);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .frame {
      padding: 40px;
      border-radius: 20px;
      border: 1px var(--md-sys-color-outline) solid;
    }

    @media (max-width: 768px) {
      .variant-grid {
        grid-template-columns: 1fr;
      }

      .modal-demo-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <script type="module" src="./date-picker.ts"></script>
</body>
</html>
