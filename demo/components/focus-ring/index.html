<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Focus Ring Demo</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap" rel="stylesheet">
    <link href="../../../src/styles/m3/tokens.css" rel="stylesheet" type="text/css" />
    <link href="../../../src/styles/m3/theme.css" rel="stylesheet" type="text/css" />
    <script type="module" defer src="./index.ts"></script>
    <style>
      .demo-container {
        display: flex;
        flex-wrap: wrap;
        gap: 1rem;
        margin-top: 1rem;
      }

      .demo-button {
        position: relative;
        padding: 12px 24px;
        border: 1px solid var(--md-sys-color-outline);
        border-radius: 8px;
        background: var(--md-sys-color-surface);
        color: var(--md-sys-color-on-surface);
        font-size: 14px;
        cursor: pointer;
        transition: background-color 150ms;
        outline: none;
      }

      .demo-button:hover {
        background: var(--md-sys-color-surface-variant);
      }

      .demo-button:focus {
        outline: none;
      }

      .input-container {
        position: relative;
        display: block;
        width: 100%;
        max-width: 300px;
      }

      .demo-input,
      .demo-textarea {
        position: relative;
        width: 100%;
        padding: 12px;
        border: 1px solid var(--md-sys-color-outline);
        border-radius: 8px;
        background: var(--md-sys-color-surface);
        color: var(--md-sys-color-on-surface);
        font-size: 14px;
      }

      .demo-input:focus,
      .demo-textarea:focus {
        outline: none;
        border-color: var(--md-sys-color-primary);
      }

      .demo-textarea {
        resize: vertical;
        min-height: 80px;
      }

      .demo-card {
        position: relative;
        padding: 1.5rem;
        border: 1px solid var(--md-sys-color-outline-variant);
        border-radius: 12px;
        background: var(--md-sys-color-surface);
        color: var(--md-sys-color-on-surface);
        cursor: pointer;
        max-width: 300px;
      }

      .demo-card:focus {
        outline: none;
      }

      .demo-card h4 {
        margin: 0 0 0.5rem 0;
        color: var(--md-sys-color-primary);
      }

      .demo-card p {
        margin: 0;
        color: var(--md-sys-color-on-surface-variant);
      }

      /* Custom focus ring styles */
      .custom-focus ui-focus-ring {
        --ui-focus-ring-color: #ff5722;
        --ui-focus-ring-width: 3px;
      }

      .dashed-focus ui-focus-ring {
        --ui-focus-ring-style: dashed;
        --ui-focus-ring-color: var(--md-sys-color-secondary);
      }

      .thick-focus ui-focus-ring {
        --ui-focus-ring-width: 4px;
        --ui-focus-ring-color: var(--md-sys-color-tertiary);
      }
    </style>
</head>
<body>
  <div id="app"></div>
</body>
</html>
