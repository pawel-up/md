<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <title>UI Confirm Dialog Demo</title>
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, minimum-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap" rel="stylesheet">
  <link href="../../../src/styles/m3/tokens.css" rel="stylesheet" type="text/css" />
  <link href="../../../src/styles/m3/theme.css" rel="stylesheet" type="text/css" />
  <style>
    .demo-section {
      margin: 40px 0;
      padding: 24px;
      border: 1px solid var(--md-sys-color-outline);
      border-radius: 8px;
    }
    
    .demo-section h2 {
      margin-top: 0;
      color: var(--md-sys-color-on-surface);
    }
    
    .demo-section p {
      margin-bottom: 20px;
      color: var(--md-sys-color-on-surface-variant);
    }
    
    .button-group {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
    
    .result {
      margin-top: 20px;
      padding: 12px;
      background: var(--md-sys-color-surface-variant);
      border-radius: 4px;
      font-family: monospace;
      color: var(--md-sys-color-on-surface-variant);
    }
  </style>
</head>
<body>
  <div id="app"></div>
  
  <script type="module" src="./confirm-dialog.ts"></script>
</body>
</html>
